x-airflow-common: &airflow-common
  image: apache/airflow:3.0.0-python3.12
  env_file:
    - .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password@db:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=true
    - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-api-server:8080/execution/
    - AIRFLOW__API_AUTH__JWT_SECRET=thisismysupersecretkeyforairflowexecution
    - AIRFLOW__WEBSERVER__SECRET_KEY=thisisanothersecretkeyforairflowwebserver
    - MLFLOW_TRACKING_URI=http://mlflow:5000
    - TEAMS_WEBHOOK_URL=http://webhook-forwarder:8085/teams
    - ML_ALERTS_WEBHOOK_URL=http://webhook-forwarder:8085/teams/ml-alerts
    # taxi_db Postgres connection — available to all Airflow workers without manual UI setup
    - AIRFLOW_CONN_TAXI_DB=postgresql://postgres:password@taxi_db:5432/taxifare
    # Gives Airflow access to pandas, mlflow, and great-expectations for our DAGs!
    - _PIP_ADDITIONAL_REQUIREMENTS=pandas numpy mlflow==2.11.3 great-expectations>=1.1.3 psycopg2-binary
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    # MLflow uses a local-filesystem artifact store. The training DAG's
    # mlflow.log_model() writes artifacts directly to this path, so the
    # Airflow workers must share the same volume as the mlflow server.
    - ./mlflow-artifacts:/mlflow/artifacts
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:15
    container_name: taxi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taxifare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d # Initializes both taxifare & airflow DBs!
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d taxifare" ]
      interval: 5s
      timeout: 5s
      retries: 5

  model_service:
    build:
      context: ./model_service
      dockerfile: Dockerfile
    container_name: taxi_api
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/taxifare
      MODEL_PATH: /app/saved_model/taxi_model.pkl
      FEATURES_PATH: /app/saved_model/features.pkl
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./model/saved_model:/app/saved_model
      - ./data:/app/data
      # Share the MLflow artifact store so the API can load the champion model
      # (models:/TaxiFareModel@champion) whose artifacts live on this volume.
      - ./mlflow-artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: always

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: taxi_frontend
    ports:
      - "8501:8501"
    depends_on:
      - model_service
    restart: always

  # --- MLFLOW SERVICE ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow_server
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./mlflow-data:/mlflow
      - ./mlflow-artifacts:/mlflow/artifacts
    command: mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    restart: always

  # --- NGINX SERVICE (GE Data Docs) ---
  nginx:
    image: nginx:alpine
    container_name: taxi_nginx
    ports:
      - "8082:80"
    volumes:
      - ./data/gx/uncommitted/data_docs/local_site:/usr/share/nginx/html:ro
    restart: always

  webhook-forwarder:
    build:
      context: ./tools/webhook_forwarder
      dockerfile: Dockerfile
    container_name: webhook_forwarder
    environment:
      - REAL_TEAMS_WEBHOOK=${REAL_TEAMS_WEBHOOK}
      - REAL_TEAMS_WEBHOOK_ML=${REAL_TEAMS_WEBHOOK_ML}
    ports:
      - "8085:8085"
    restart: always

  # --- GRAFANA SERVICE ---
  grafana:
    image: grafana/grafana:10.2.2
    container_name: taxi_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # --- AIRFLOW 3 CONTAINERS ---
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: version
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password@db:5432/airflow
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas numpy mlflow==2.11.3 great-expectations>=1.1.3 psycopg2-binary
    depends_on:
      db:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow_api_server
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  grafana_data:

